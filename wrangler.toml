# Cloudflare Pages project. The dashboard reads this file on every build:
# vars and the KV binding below are the source of truth (edit here, not in the dashboard).
# The one secret, GOOGLE_PRIVATE_KEY, is set in the dashboard: Settings → Variables and Secrets.
name = "jangad-board"
pages_build_output_dir = "web"
compatibility_date = "2025-09-01"

[[kv_namespaces]]
binding = "BOARD_CACHE"
id = "512b15e70a9d4e3495790c709abdc832"

[vars]
SHEET_ID = "1IhNZlP3YxM8lVTboyxB2EeJkReGN86ONSHi-buNkE3I"
TABS = "Seyaa Solitaire,PRATIK C-6,RAKESH BABU,RAJKUMAR,Anthem Jewels"
STOCK_DUE = "8"
BUYER_DUE = "5"
WARN2_DAY = "10"
FINAL_DAY = "12"
RETURN_RECEIVED_CLOSES_ORDER = "true"   # SPEC §3 open decision
CUTOFF_DATE = ""                         # yyyy-mm-dd; orders issued before this are ignored
KNOWN_STATUSES = ""                      # the Status dropdown values, comma-separated; enables the "odd status" check
CACHE_SECONDS = "60"
GOOGLE_CLIENT_EMAIL = "jangad-board@vibrant-sound-511310-m3.iam.gserviceaccount.com"

# Login — users live in a Google Sheet owned by devalshah713@gmail.com, shared with the service account as EDITOR
# (the admin page writes to it). Row 1 headers: Username, Password, Full Name, Role, Active, Notes.
# Role "Admin" can open /admin; passwords set there are stored hashed ("pbkdf2$…").
USERS_SHEET_ID = ""                      # the users sheet's ID (the long code in its URL)
USERS_TAB = ""                           # tab name; empty = first tab
USERS_USERNAME_HEADER = "username,user name,user id,login"   # accepted header names for the username column
USERS_PASSWORD_HEADER = "password"       # accepted header names for the password column
BOARD_USERS = ""                         # optional: only these usernames may log in (comma-separated); empty = everyone in the sheet
SESSION_HOURS = "12"                     # how long a login lasts

# Secrets (dashboard → Settings → Variables and Secrets), never in this file:
#   GOOGLE_PRIVATE_KEY   the service account's private key
#   SESSION_SECRET       any long random string; changing it logs everyone out
