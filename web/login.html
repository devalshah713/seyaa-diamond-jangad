<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jangad Board Login</title>
<style>
:root { --bg: #f6f5f2; --panel: #fff; --ink: #1b1b1f; --muted: #6b6b75; --line: #e3e1dc; --accent: #1d4ed8; --err: #b91c1c; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #111114; --panel: #1a1a1f; --ink: #ececf1; --muted: #9a9aa6; --line: #2c2c34; --accent: #60a5fa; --err: #f87171; }
}
:root[data-theme="dark"] { --bg: #111114; --panel: #1a1a1f; --ink: #ececf1; --muted: #9a9aa6; --line: #2c2c34; --accent: #60a5fa; --err: #f87171; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
form { width: 100%; max-width: 360px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 24px; display: grid; gap: 14px; }
h1 { font-size: 20px; margin: 0; }
p { margin: 0; color: var(--muted); font-size: 13px; }
label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
input { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
button { font: inherit; font-weight: 600; border: 0; border-radius: 8px; padding: 11px; background: var(--accent); color: #fff; cursor: pointer; }
button:disabled { opacity: .6; cursor: default; }
.err { color: var(--err); font-size: 13px; min-height: 1.2em; }
</style>
<script>try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
</head>
<body>
<form id="f" autocomplete="on">
  <div>
    <h1>Jangad Follow-Up Board</h1>
    <p>Sign in with your company username and password.</p>
  </div>
  <label>Username <input name="username" autocomplete="username" required autofocus></label>
  <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
  <div class="err" id="err" role="alert"></div>
  <button id="go">Sign in</button>
</form>
<script>
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("go"), err = document.getElementById("err");
  btn.disabled = true; err.textContent = "";
  try {
    const fd = new FormData(e.target);
    const res = await fetch("/api/login", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ username: fd.get("username"), password: fd.get("password") }),
    });
    if (res.ok) { location.href = "/"; return; }
    const j = await res.json().catch(() => ({}));
    err.textContent = j.error || "Sign-in failed.";
  } catch {
    err.textContent = "Network error — try again.";
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
