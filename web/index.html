<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jangad Follow-Up Board</title>
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --ink: #1b1b1f; --muted: #6b6b75; --line: #e3e1dc;
  --band: #16161a; --band-ink: #f4f4f6;
  --ok: #2f7d4f; --w1: #b98900; --w2: #d26a00; --final: #c2410c; --breach: #b91c1c; --due: #7c3aed; --crit: #9d174d;
  --chip-ink: #fff; --accent: #1d4ed8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111114; --panel: #1a1a1f; --ink: #ececf1; --muted: #9a9aa6; --line: #2c2c34;
    --band: #000; --band-ink: #f4f4f6;
    --ok: #4ade80; --w1: #facc15; --w2: #fb923c; --final: #f97316; --breach: #f87171; --due: #a78bfa; --crit: #f472b6;
    --chip-ink: #111; --accent: #60a5fa;
  }
}
:root[data-theme="dark"] {
  --bg: #111114; --panel: #1a1a1f; --ink: #ececf1; --muted: #9a9aa6; --line: #2c2c34;
  --band: #000; --band-ink: #f4f4f6;
  --ok: #4ade80; --w1: #facc15; --w2: #fb923c; --final: #f97316; --breach: #f87171; --due: #a78bfa; --crit: #f472b6;
  --chip-ink: #111; --accent: #60a5fa;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; padding: 14px 16px; }
h1 { font-size: 18px; margin: 0; }
.meta { color: var(--muted); font-size: 13px; }
.meta.stale { color: var(--breach); font-weight: 600; }
button, select, input { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
button { cursor: pointer; }
button:hover { border-color: var(--muted); }
.wrap { padding: 0 16px 32px; max-width: 1280px; margin: 0 auto; }


.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; border-top: 4px solid var(--c, var(--line)); }
.kpi .n { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.kpi .l { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
.kpi .c { color: var(--muted); font-variant-numeric: tabular-nums; }

nav.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
nav.tabs button { border: 0; border-bottom: 3px solid transparent; border-radius: 0; background: none; padding: 8px 12px; white-space: nowrap; color: var(--muted); }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }

.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; position: sticky; top: 0; background: var(--panel); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }
.day { font-weight: 700; font-variant-numeric: tabular-nums; border-left: 5px solid var(--c, var(--line)); padding-left: 8px; }
.chip { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; border: 1.5px solid var(--c); color: var(--c); white-space: nowrap; }
.chip.solid { background: var(--c); color: var(--chip-ink); }
.tier-buyer { font-weight: 700; }
.small { color: var(--muted); font-size: 12px; }
.empty { padding: 24px; text-align: center; color: var(--muted); }
.err { background: color-mix(in srgb, var(--breach) 12%, var(--panel)); border: 1px solid var(--breach); border-radius: 10px; padding: 12px; margin-bottom: 14px; }

.bars { display: grid; gap: 12px; padding: 14px; }
.bar-row { display: grid; grid-template-columns: 140px 1fr 90px; gap: 10px; align-items: center; }
.bar { display: flex; height: 22px; border-radius: 5px; overflow: hidden; background: var(--line); }
.bar span { background: var(--c); height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 0 14px 14px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--c); margin-right: 5px; vertical-align: -1px; }

.fbar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; }
.fbtn { display: grid; gap: 1px; text-align: left; min-width: 132px; padding: 8px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--panel); }
.fbtn b { font-size: 14px; white-space: nowrap; }
.fbtn span { font-size: 12px; color: var(--muted); white-space: nowrap; }
.fbtn .late { color: var(--breach); font-weight: 600; }
.fbtn[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--panel)); }
.fbtn[aria-pressed="true"] b { color: var(--accent); }
.stage-table td, .stage-table th { padding: 6px 10px; }
.dbar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: end; margin-bottom: 14px; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
.dbar label { display: grid; gap: 3px; font-size: 12px; color: var(--muted); }
.dbar .quick { display: flex; gap: 6px; flex-wrap: wrap; }
.dbar .quick button { font-size: 13px; padding: 5px 9px; }
.dbar .quick button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.dbar .oldest { flex-basis: 100%; font-size: 13px; }
.dbar .types { flex-basis: 100%; display: inline-flex; flex-wrap: wrap; gap: 0; }
.dbar .types button { border-radius: 0; margin-left: -1px; padding: 7px 14px; font-weight: 600; }
.dbar .types button:first-child { border-radius: 8px 0 0 8px; margin-left: 0; }
.dbar .types button:last-child { border-radius: 0 8px 8px 0; }
.dbar .types button span { font-weight: 400; color: var(--muted); margin-left: 4px; }
.dbar .types button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; position: relative; }
.dbar .types button[aria-pressed="true"] span { color: #fff; }
.dbar .oldest b { color: var(--breach); }
td.pick, th.pick { width: 34px; padding-right: 0; }
.pick input { width: 18px; height: 18px; cursor: pointer; accent-color: var(--accent); }
tr.picked td { background: color-mix(in srgb, var(--accent) 7%, transparent); }
.selbar { position: sticky; bottom: 0; z-index: 6; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between;
  margin-top: 14px; padding: 10px 14px; border-radius: 10px; background: var(--band); color: var(--band-ink); box-shadow: 0 -4px 16px rgb(0 0 0 / .15); }
.selbar[hidden] { display: none; }
.selbar .acts { display: flex; flex-wrap: wrap; gap: 8px; }
.selbar button { background: transparent; color: var(--band-ink); border-color: rgb(255 255 255 / .35); }
.selbar button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.msg-btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.msg-btns button, .msg-btns a { font-size: 12px; padding: 3px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); text-decoration: none; cursor: pointer; }
.msg-btns button.done { border-color: var(--ok); color: var(--ok); }
.bulk { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.bulk p { margin: 0; }
.exgrid { display: grid; gap: 14px; }
.exgrid h3 { margin: 0; padding: 10px 12px; font-size: 14px; border-bottom: 1px solid var(--line); }
@media (max-width: 640px) {
  .bar-row { grid-template-columns: 90px 1fr 70px; }
  .hide-sm { display: none; }
}
</style>
</head>
<body>
<header>
  <div>
    <h1>Jangad Follow-Up Board</h1>
    <div class="meta" id="meta">Loading…</div>
  </div>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <span class="meta" id="who"></span>
    <button id="refresh" title="Re-read the sheet now">↻ Refresh now</button>
    <button id="theme" title="Toggle light / dark">Theme</button>
    <a href="/admin" id="adminLink" hidden><button>Admin</button></a>
    <button id="logout">Log out</button>
  </div>
</header>
<div class="wrap">
  <div id="error"></div>
  <nav class="fbar" id="fbar" aria-label="Factory"></nav>
  <section class="dbar" id="dbar" aria-label="Issue date filter"></section>
  <section class="kpis" id="kpis"></section>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="view"></main>
  <div class="selbar" id="selbar" hidden></div>
</div>

<script>
const STAGE_VAR = {
  "On Track": "--ok", "Warning 1": "--w1", "Warning 2": "--w2", "Final Warning": "--final",
  "Breach": "--breach", "Due Today": "--due", "Critical": "--crit",
};
const STAGE_ORDER = ["Critical", "Due Today", "Breach", "Final Warning", "Warning 2", "Warning 1", "On Track"];
const SOLID = new Set(["Breach", "Critical"]);
const TABS = [
  ["follow", "Follow-Up Today"], ["queue", "All Pending Orders"], ["score", "Factory Scorecard"],
  ["risk", "Carats at Risk"], ["ex", "Exceptions"],
];
let data = null;
let tab = safeGet("tab") || "follow";
const q = { stage: "", search: "" };
// selected factory ("" = all): from the link (#f=…) first, else the last one used
// Filters live in the link (#f=PRATIK%20C-6&from=2026-09-01&to=2026-09-30) so a view can be shared.
// The factory is also remembered between visits; dates and sort are not.
const hp = new URLSearchParams(location.hash.slice(1));
let factory = hp.has("f") ? hp.get("f") : safeGet("factory") || "";
let dfrom = hp.get("from") || "";
let dto = hp.get("to") || "";
let sortBy = safeGet("sort") || "priority";
let tier = { buyer: "Buyer", stock: "Stock" }[hp.get("t")] || ""; // "" = all, "Buyer" = Buyer Name filled, "Stock" = empty
const inFactory = (x) => !factory || x.factory === factory;
const inDates = (o) => (!dfrom || o.issueDate >= dfrom) && (!dto || o.issueDate <= dto); // ISO dates compare as text
const inTier = (o) => !tier || o.tier === tier;
const inRange = (o) => inDates(o) && inTier(o); // date + order-type filters
const SORTS = {
  priority: [(a, b) => 0, "Buyer first, most overdue"], // server order
  oldest: [(a, b) => a.issueDate.localeCompare(b.issueDate) || b.day - a.day, "Oldest issued first"],
  newest: [(a, b) => b.issueDate.localeCompare(a.issueDate), "Newest issued first"],
  carats: [(a, b) => b.carats - a.carats, "Most carats first"],
};
const orders = () => data.orders.filter((o) => inFactory(o) && inRange(o)).sort(SORTS[sortBy][0]);
const isLate = (o) => o.stage !== "On Track";
function syncHash() {
  const p = new URLSearchParams();
  if (factory) p.set("f", factory);
  if (dfrom) p.set("from", dfrom);
  if (dto) p.set("to", dto);
  if (tier) p.set("t", tier.toLowerCase());
  const h = p.toString();
  history.replaceState(null, "", h ? "#" + h : location.pathname);
}
function setFactory(f) {
  factory = f;
  safeSet("factory", f);
  syncHash();
  render();
}
function setTier(t) {
  tier = t;
  syncHash();
  render();
}
function setDates(from, to) {
  dfrom = from || "";
  dto = to || "";
  if (dfrom && dto && dfrom > dto) [dfrom, dto] = [dto, dfrom];
  syncHash();
  render();
}
const isoDay = (d) => d.toISOString().slice(0, 10);
function monthRange(ym) {
  const [y, m] = ym.split("-").map(Number);
  return [`${ym}-01`, isoDay(new Date(Date.UTC(y, m, 0)))];
}
const monthLabel = (ym) => new Date(ym + "-01T00:00:00Z").toLocaleDateString("en-IN", { month: "long", year: "numeric", timeZone: "UTC" });

function safeGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function safeSet(k, v) { try { localStorage.setItem(k, v); } catch {} }
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const cts = (n) => (n ?? 0).toLocaleString("en-IN", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const fmtDate = (iso) => iso ? new Date(iso + "T00:00:00Z").toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric", timeZone: "UTC" }) : "";
const cv = (stage) => `var(${STAGE_VAR[stage]})`;
const chip = (stage) => `<span class="chip${SOLID.has(stage) ? " solid" : ""}" style="--c:${cv(stage)}">${esc(stage)}</span>`;
const dayCell = (o) => `<td class="num"><span class="day" style="--c:${cv(o.stage)}">${o.day}</span></td>`;

// ---- theme
(function () {
  const t = safeGet("theme");
  if (t) document.documentElement.dataset.theme = t;
  document.getElementById("theme").onclick = () => {
    const dark = document.documentElement.dataset.theme
      ? document.documentElement.dataset.theme === "dark"
      : matchMedia("(prefers-color-scheme: dark)").matches;
    const next = dark ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    safeSet("theme", next);
  };
})();

// ---- data
async function load(refresh) {
  const btn = document.getElementById("refresh");
  btn.disabled = true;
  try {
    const res = await fetch("/api/board" + (refresh ? "?refresh=1" : ""), { cache: "no-store" });
    if (res.status === 401) { location.href = "/login"; return; }
    const json = await res.json();
    if (!res.ok) throw new Error(json.error || res.statusText);
    data = json;
    if (factory && !data.factories.some((f) => f.factory === factory)) factory = "";
    const open = new Set(data.orders.map(keyOf));
    for (const k of [...selected]) if (!open.has(k)) selected.delete(k); // received since last load
    document.getElementById("error").innerHTML = "";
    render();
  } catch (e) {
    document.getElementById("error").innerHTML = `<div class="err"><b>Could not load the board.</b> ${esc(e.message)}</div>`;
  } finally {
    btn.disabled = false;
  }
}
document.getElementById("refresh").onclick = () => load(true);
document.getElementById("logout").onclick = async () => {
  try { await fetch("/api/logout", { method: "POST" }); } finally { location.href = "/login"; }
};

function renderMeta() {
  document.getElementById("who").textContent = data.user ? "Signed in as " + data.user : "";
  document.getElementById("adminLink").hidden = data.role !== "Admin";
  const at = new Date(data.generatedAt);
  const ageMin = Math.round((Date.now() - at) / 60000);
  const el = document.getElementById("meta");
  el.textContent = `Sheet read ${at.toLocaleString("en-IN", { timeZone: "Asia/Kolkata", dateStyle: "medium", timeStyle: "short" })} IST` +
    ` · ${ageMin <= 0 ? "just now" : ageMin + " min ago"} · today ${fmtDate(data.today)}` +
    (data.config.cutoffDate ? ` · ignoring orders before ${fmtDate(data.config.cutoffDate)}` : "") +
    (factory ? ` · showing ${factory} only` : "") +
    (tier ? ` · ${tier.toLowerCase()} orders only` : "") +
    (dfrom || dto ? ` · issued ${dfrom ? fmtDate(dfrom) : "start"} → ${dto ? fmtDate(dto) : "today"}` : "");
  el.className = "meta" + (ageMin > 10 ? " stale" : "");
}
setInterval(() => data && renderMeta(), 30000);

function render() {
  renderMeta();
  // factory bar — open and late per factory; click to filter the whole board
  const btn = (f, label, open, late) =>
    `<button class="fbtn" aria-pressed="${factory === f}" data-f="${esc(f)}"><b>${esc(label)}</b>` +
    `<span>${open} open · <span class="${late ? "late" : ""}">${late} late</span></span></button>`;
  document.getElementById("fbar").innerHTML =
    btn("", "All factories", data.orders.filter(inRange).length, data.orders.filter((o) => inRange(o) && isLate(o)).length) +
    data.factories.map((f) => {
      const os = data.orders.filter((o) => o.factory === f.factory && inRange(o));
      return btn(f.factory, f.factory, os.length, os.filter(isLate).length);
    }).join("");
  document.querySelectorAll("#fbar .fbtn").forEach((b) => b.onclick = () => setFactory(b.dataset.f));
  renderDateBar();

  // KPIs
  const os = orders();
  const sum = (...ks) => os.filter((o) => ks.includes(o.stage)).reduce((a, o) => ({ count: a.count + 1, carats: a.carats + o.carats }), { count: 0, carats: 0 });
  const tiles = [
    [factory ? "Open · " + factory : "Open", sum(...STAGE_ORDER), "--accent"],
    ["On Track", sum("On Track"), "--ok"],
    ["Warning 1", sum("Warning 1"), "--w1"],
    ["Warning 2 + Final", sum("Warning 2", "Final Warning"), "--final"],
    ["Breached", sum("Breach", "Critical"), "--breach"],
    ["Due Today (buyer)", sum("Due Today"), "--due"],
  ];
  document.getElementById("kpis").innerHTML = tiles.map(([l, v, c]) =>
    `<div class="kpi" style="--c:var(${c})"><div class="l">${l}</div><div class="n">${v.count}</div><div class="c">${cts(v.carats)} cts</div></div>`).join("");

  const count = { follow: followRows().length, queue: orders().length };
  document.getElementById("tabs").innerHTML = TABS.map(([k, l]) =>
    `<button role="tab" aria-selected="${k === tab}" data-k="${k}">${l}${k in count ? ` <span class="small">(${count[k]})</span>` : ""}</button>`).join("");
  document.querySelectorAll("#tabs button").forEach((b) => b.onclick = () => { tab = b.dataset.k; safeSet("tab", tab); render(); });

  const v = document.getElementById("view");
  shown = [];
  v.innerHTML = { follow: viewFollow, queue: viewQueue, score: viewScore, risk: viewRisk, ex: viewEx }[tab]();
  v.querySelectorAll("input[data-some]").forEach((x) => (x.indeterminate = true));
  renderSelBar();
  if (tab === "queue") bindFilters();
}

// ---- follow-up messages for the factory group
const SUNDAY = 0;
/** Date of working day n (Mon–Sat; day 1 = issue date, or the Monday after a Sunday issue). */
function workingDayDate(issueIso, n) {
  const d = new Date(issueIso + "T00:00:00Z");
  if (d.getUTCDay() === SUNDAY) d.setUTCDate(d.getUTCDate() + 1);
  for (let k = 1; k < n; ) { d.setUTCDate(d.getUTCDate() + 1); if (d.getUTCDay() !== SUNDAY) k++; }
  return d.toISOString().slice(0, 10);
}
const dueDay = (o) => (o.tier === "Buyer" ? data.config.buyerDue : data.config.stockDue);
const URGENCY = {
  "Warning 1": "Reminder", "Warning 2": "Second reminder", "Final Warning": "FINAL REMINDER",
  "Breach": "URGENT – OVERDUE", "Due Today": "BUYER ORDER – DUE TODAY", "Critical": "URGENT – BUYER ORDER OVERDUE",
  "On Track": "Status check",
};
function orderLines(o) {
  const late = o.day - dueDay(o);
  const timing = late > 0 ? `${late} working day${late === 1 ? "" : "s"} late (day ${o.day}; target ${dueDay(o)} days)`
    : late === 0 ? `due today (day ${o.day} of ${dueDay(o)})`
    : `day ${o.day} of ${dueDay(o)}`;
  return [
    `Design: ${o.design}${o.sub ? " / Sub " + o.sub : ""}${o.product ? " (" + o.product + ")" : ""}`,
    `Issued: ${fmtDate(o.issueDate)}${o.memo ? " · Memo " + o.memo : ""}`,
    `Diamonds: ${o.pcs} pc${o.pcs === 1 ? "" : "s"} · ${cts(o.carats)} cts`,
    `Due: ${fmtDate(workingDayDate(o.issueDate, dueDay(o)))} – ${timing}`,
    o.tier === "Buyer" ? "Priority: BUYER ORDER" : "",
  ].filter(Boolean);
}
function orderMessage(o) {
  return [
    `*${URGENCY[o.stage]} – ${o.factory}*`,
    "",
    ...orderLines(o),
    "",
    ...(o.day > dueDay(o)
      ? ["Please reply with:", "1. Reason for the delay", "2. Exact delivery date"]
      : ["Please confirm it will be delivered on the due date, or tell us the reason and new date if not."]),
  ].join("\n");
}
function factoryMessage(f, rows) {
  return [
    `*Pending delivery follow-up – ${f}*`,
    `${rows.length} order${rows.length === 1 ? "" : "s"} needing follow-up, as of ${fmtDate(data.today)}:`,
    "",
    ...rows.flatMap((o, i) => [`${i + 1}. ${URGENCY[o.stage]}`, ...orderLines(o).map((l) => "   " + l), ""]),
    "Please reply for EACH design with:",
    "1. Reason for the delay",
    "2. Exact delivery date",
  ].join("\n");
}
async function copyText(text, btn) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const t = document.createElement("textarea");
    t.value = text; t.style.position = "fixed"; t.style.opacity = "0";
    document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove();
  }
  const label = btn.textContent;
  btn.textContent = "Copied ✓"; btn.classList.add("done");
  setTimeout(() => { btn.textContent = label; btn.classList.remove("done"); }, 1800);
}
const waLink = (text) => "https://wa.me/?text=" + encodeURIComponent(text);
let shown = []; // rows in the current table, for the message buttons
document.addEventListener("click", (e) => {
  const g = e.target.closest("[data-goto]");
  if (g) { e.preventDefault(); tab = g.dataset.goto; safeSet("tab", tab); render(); return; }
  const b = e.target.closest("[data-copy]");
  if (!b) return;
  const v = b.dataset.copy;
  copyText(v === "all" ? factoryMessage(factory, shown) : orderMessage(shown[+v]), b);
});

function renderDateBar() {
  const months = [...new Set(data.orders.filter(inFactory).map((o) => o.issueDate.slice(0, 7)))].sort().reverse();
  const curMonth = dfrom && dto && dfrom.endsWith("-01") && monthRange(dfrom.slice(0, 7))[1] === dto ? dfrom.slice(0, 7) : "";
  const thisMonth = data.today.slice(0, 7);
  const lastMonth = isoDay(new Date(Date.UTC(+thisMonth.slice(0, 4), +thisMonth.slice(5, 7) - 2, 1))).slice(0, 7);
  const ago = (n) => { const d = new Date(data.today + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() - n); return isoDay(d); };
  const quick = [
    ["This month", ...monthRange(thisMonth)],
    ["Last month", ...monthRange(lastMonth)],
    ["Last 30 days", ago(30), data.today],
    ["Older than 30 days", "", ago(31)],
    ["Older than 90 days", "", ago(91)],
  ];
  const pending = data.orders.filter((o) => inFactory(o) && inRange(o));
  const oldest = pending.reduce((a, o) => (!a || o.issueDate < a.issueDate ? o : a), null);
  const typeCount = (t) => data.orders.filter((o) => inFactory(o) && inDates(o) && (!t || o.tier === t)).length;
  document.getElementById("dbar").innerHTML = `
    <div class="types" role="group" aria-label="Order type">${[["", "All orders"], ["Buyer", "Buyer orders"], ["Stock", "Stock orders"]].map(([t, l]) =>
      `<button data-tier="${t}" aria-pressed="${tier === t}">${l} <span>${typeCount(t)}</span></button>`).join("")}</div>
    <label>Issued in month
      <select id="d-month"><option value="">All months</option>${months.map((m) =>
        `<option value="${m}" ${m === curMonth ? "selected" : ""}>${monthLabel(m)} (${data.orders.filter((o) => inFactory(o) && inTier(o) && o.issueDate.startsWith(m)).length})</option>`).join("")}</select>
    </label>
    <label>From <input type="date" id="d-from" value="${dfrom}" max="${data.today}"></label>
    <label>To <input type="date" id="d-to" value="${dto}" max="${data.today}"></label>
    <div class="quick">${quick.map(([l, f, t]) =>
      `<button data-from="${f}" data-to="${t}" aria-pressed="${dfrom === f && dto === t}">${l}</button>`).join("")}
      ${dfrom || dto ? '<button data-from="" data-to="">✕ Clear dates</button>' : ""}</div>
    <label>Sort lists
      <select id="d-sort">${Object.entries(SORTS).map(([k, [, l]]) => `<option value="${k}" ${k === sortBy ? "selected" : ""}>${l}</option>`).join("")}</select>
    </label>
    <div class="oldest">${oldest
      ? `Oldest pending${factory ? " at " + esc(factory) : ""}${dfrom || dto ? " in this range" : ""}: <b>${fmtDate(oldest.issueDate)}</b> — ${esc(oldest.design)} (${esc(oldest.factory)}), day ${oldest.day}, ${cts(oldest.carats)} cts · ${pending.length} pending in view`
      : "No pending orders in this range."}</div>`;
  document.getElementById("d-month").onchange = (e) => e.target.value ? setDates(...monthRange(e.target.value)) : setDates("", "");
  document.getElementById("d-from").onchange = (e) => setDates(e.target.value, dto);
  document.getElementById("d-to").onchange = (e) => setDates(dfrom, e.target.value);
  document.getElementById("d-sort").onchange = (e) => { sortBy = e.target.value; safeSet("sort", sortBy); render(); };
  document.querySelectorAll("#dbar .quick button").forEach((b) => b.onclick = () => setDates(b.dataset.from, b.dataset.to));
  document.querySelectorAll("#dbar .types button").forEach((b) => b.onclick = () => setTier(b.dataset.tier));
}

/** Per-factory open / breached / carats / stages from the orders currently in view. */
function factoryStats(f) {
  const os = data.orders.filter((o) => o.factory === f.factory && inRange(o));
  const byStage = Object.fromEntries(STAGE_ORDER.map((st) => [st, { count: 0, carats: 0 }]));
  for (const o of os) { byStage[o.stage].count++; byStage[o.stage].carats += o.carats; }
  return {
    ...f,
    open: os.length,
    breached: os.filter((o) => o.stage === "Breach" || o.stage === "Critical").length,
    carats: os.reduce((a, o) => a + o.carats, 0),
    byStage,
  };
}

// ---- selection + Excel export
const selected = new Set(); // keys "factory|row" — survive tab, factory and date changes
const keyOf = (o) => o.factory + "|" + o.row;
function renderSelBar() {
  const bar = document.getElementById("selbar");
  const picked = data.orders.filter((o) => selected.has(keyOf(o)));
  const inView = shown.filter((o) => !selected.has(keyOf(o))).length;
  bar.hidden = !picked.length && !shown.length;
  const facs = [...new Set(picked.map((o) => o.factory))];
  const inShown = new Set(shown.map(keyOf));
  const hidden = shown.length ? picked.filter((o) => !inShown.has(keyOf(o))).length : 0;
  bar.innerHTML = picked.length
    ? `<span><b>${picked.length} selected</b> · ${cts(picked.reduce((a, o) => a + o.carats, 0))} cts · ${facs.length === 1 ? esc(facs[0]) : facs.length + " factories"}${hidden ? ` · <u>${hidden} not in the current view</u> (still included)` : ""}</span>
       <span class="acts">${inView ? `<button data-sel="view">Select all ${shown.length} in view</button>` : ""}
       <button data-sel="clear">Clear selection</button>
       <button class="primary" data-sel="xlsx">⬇ Download Excel</button></span>`
    : `<span>Tick orders to download them as an Excel file for the factory.</span>
       <span class="acts">${shown.length ? `<button data-sel="view">Select all ${shown.length} in view</button>` : ""}</span>`;
}
function selectRows(rows, on) { for (const o of rows) on ? selected.add(keyOf(o)) : selected.delete(keyOf(o)); }
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.matches("input[data-pick]")) { selectRows([shown[+t.dataset.pick]], t.checked); render(); }
  if (t.matches("input[data-pick-all]")) { selectRows(shown, t.checked); render(); }
});
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-sel]");
  if (!b) return;
  if (b.dataset.sel === "view") { selectRows(shown, true); render(); }
  if (b.dataset.sel === "clear") { selected.clear(); render(); }
  if (b.dataset.sel === "xlsx") downloadExcel(b);
});

let xlsxLib = null;
function loadXlsx() {
  return xlsxLib ??= new Promise((ok, fail) => {
    const s = document.createElement("script");
    s.src = "/vendor/xlsx-0.18.5.mini.min.js";
    s.onload = () => ok(window.XLSX);
    s.onerror = () => { xlsxLib = null; fail(new Error("Could not load the Excel library — check the connection and try again.")); };
    document.head.appendChild(s);
  });
}
const toDate = (iso) => new Date(iso + "T00:00:00Z");
function factorySheet(XLSX, f, rows) {
  const head = ["Sr No", "Design Number", "Sub Design No", "Product", "Issue Date",
    "Due Date", "Working Days", "Days Late", "Status", "Priority", "Reason for Delay", "Expected Delivery Date"];
  const body = rows.map((o, i) => {
    const late = o.day - dueDay(o);
    return [i + 1, o.design, o.sub, o.product, toDate(o.issueDate),
      toDate(workingDayDate(o.issueDate, dueDay(o))), o.day, late > 0 ? late : 0, o.stage, o.tier === "Buyer" ? "BUYER ORDER" : "Stock", "", ""];
  });
  const aoa = [
    [`Pending orders – ${f}`],
    [`As of ${fmtDate(data.today)} · ${rows.length} order${rows.length === 1 ? "" : "s"} · please fill in the reason and expected delivery date`],
    [],
    head, ...body,
  ];
  const ws = XLSX.utils.aoa_to_sheet(aoa, { cellDates: true, dateNF: "dd-mmm-yyyy" });
  for (const ref of Object.keys(ws)) {
    const c = ws[ref];
    if (c && c.t === "d") c.z = "dd-mmm-yyyy";
  }
  ws["!cols"] = [6, 34, 14, 14, 13, 13, 12, 10, 16, 13, 30, 20].map((w) => ({ wch: w }));
  ws["!autofilter"] = { ref: `A4:L${4 + body.length}` };
  ws["!merges"] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: 11 } }, { s: { r: 1, c: 0 }, e: { r: 1, c: 11 } }];
  return ws;
}
const safeName = (s) => s.replace(/[\\/:*?"<>|\[\]]/g, " ").trim();
async function downloadExcel(btn) {
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = "Preparing…";
  try {
    const XLSX = await loadXlsx();
    // keep the on-screen order (current sort), grouped by factory
    const picked = [...data.orders].sort(SORTS[sortBy][0]).filter((o) => selected.has(keyOf(o)));
    const facs = [...new Set(picked.map((o) => o.factory))];
    const wb = XLSX.utils.book_new();
    for (const f of facs) XLSX.utils.book_append_sheet(wb, factorySheet(XLSX, f, picked.filter((o) => o.factory === f)), safeName(f).slice(0, 31));
    // e.g. "Seyaa Solitaire Pending Orders 12-Oct-2026" — the date the file is downloaded (India time)
    const stamp = new Date().toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric", timeZone: "Asia/Kolkata" }).replace(/ /g, "-").replace("Sept", "Sep");
    const party = facs.length === 1 ? safeName(facs[0]) : `${facs.length} Factories`;
    const name = `${party} Pending Orders ${stamp}`;
    XLSX.writeFile(wb, name + ".xlsx", { compression: true });
  } catch (err) {
    alert(err.message);
  } finally {
    btn.disabled = false; btn.textContent = label;
  }
}

function orderTable(rows, withAction) {
  shown = rows;
  shown = rows;
  if (!rows.length) return `<div class="panel"><div class="empty">Nothing here.</div></div>`;
  const all = rows.length && rows.every((o) => selected.has(keyOf(o)));
  const some = !all && rows.some((o) => selected.has(keyOf(o)));
  return `<div class="panel"><table><thead><tr>
    <th class="pick"><input type="checkbox" data-pick-all ${all ? "checked" : ""} ${some ? "data-some" : ""} title="Select all ${rows.length} in view" aria-label="Select all in view"></th>
    <th class="num">Day</th><th>Stage</th>${withAction ? "<th>Action</th>" : ""}<th>Design</th><th>Factory</th>
    <th>Priority</th><th class="hide-sm">Issued</th><th class="num">Cts</th><th class="num hide-sm">Pcs</th><th class="hide-sm">Memo</th>
  </tr></thead><tbody>${rows.map((o, i) => `<tr class="${selected.has(keyOf(o)) ? "picked" : ""}">
    <td class="pick"><input type="checkbox" data-pick="${i}" ${selected.has(keyOf(o)) ? "checked" : ""} aria-label="Select ${esc(o.design)}"></td>
    ${dayCell(o)}<td>${chip(o.stage)}</td>${withAction ? `<td>${esc(o.action)}</td>` : ""}
    <td><b>${esc(o.design)}</b>${o.sub ? `<div class="small">sub ${esc(o.sub)}</div>` : ""}${o.product ? `<div class="small">${esc(o.product)}</div>` : ""}
      <div class="msg-btns"><button data-copy="${i}" title="Copy a follow-up message for the factory group">Copy message</button>
      <a href="${waLink(orderMessage(o))}" target="_blank" rel="noopener" title="Open WhatsApp with this message">WhatsApp</a></div></td>
    <td>${esc(o.factory)}<div class="small">row ${o.row}</div></td>
    <td class="${o.tier === "Buyer" ? "tier-buyer" : ""}">${o.tier === "Buyer" ? "Buyer · " + esc(o.buyer) : "Stock"}</td>
    <td class="hide-sm">${fmtDate(o.issueDate)}</td><td class="num">${cts(o.carats)}</td><td class="num hide-sm">${o.pcs}</td><td class="hide-sm">${esc(o.memo)}</td>
  </tr>`).join("")}</tbody></table></div>`;
}

/** Late orders; with "Buyer orders" selected, every pending buyer order so urgent ones can be picked early. */
const followRows = () => (tier === "Buyer" ? orders() : orders().filter(isLate));
function viewFollow() {
  const rows = followRows();
  const bulk = factory && rows.length
    ? `<div class="msg-btns"><button data-copy="all">Copy all ${rows.length} for ${esc(factory)}</button>
       <a href="${waLink(factoryMessage(factory, rows))}" target="_blank" rel="noopener">WhatsApp all</a></div>`
    : `<span class="small">Pick a factory above to copy one message covering all these orders.</span>`;
  const what = tier === "Buyer"
    ? `${rows.length} pending buyer orders${factory ? " at " + esc(factory) : ""} — all of them, including ones not yet due`
    : `${rows.length} orders${factory ? " at " + esc(factory) : ""} at or past a warning step (on-time orders are in <a href="#" data-goto="queue">All Pending Orders</a>)`;
  return `<div class="bulk"><p class="small">${what} — sorted: ${SORTS[sortBy][1].toLowerCase()}.</p>${bulk}</div>` + orderTable(rows, true);
}

function viewQueue() {
  const opt = (vals, cur, all) => `<option value="">${all}</option>` + vals.map((x) => `<option ${x === cur ? "selected" : ""}>${esc(x)}</option>`).join("");
  const s = q.search.trim().toLowerCase();
  const all = orders();
  const rows = all.filter((o) =>
    (!q.stage || o.stage === q.stage) &&
    (!s || o.design.toLowerCase().includes(s) || o.sub.toLowerCase().includes(s)));
  return `<div class="filters">
    <select id="f-stage">${opt(STAGE_ORDER, q.stage, "All stages")}</select>
    <input id="f-search" type="search" placeholder="Search design number" value="${esc(q.search)}">
    <span class="small" style="align-self:center">${rows.length} of ${all.length} open${factory ? " at " + esc(factory) : ""}</span>
  </div>` + orderTable(rows, false);
}
function bindFilters() {
  const on = (id, k, ev = "change") => {
    const el = document.getElementById(id);
    el.addEventListener(ev, () => {
      q[k] = el.value; render();
      if (ev === "input") { const n = document.getElementById(id); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }
    });
  };
  on("f-stage", "stage"); on("f-search", "search", "input");
}

function viewScore() {
  const target = data.config.stockDue;
  return `<p class="small">Actual turnaround on closed orders, in working days (issue → received), against the ${target}-day target.
    Mean and median both shown: never-closed rows drag the mean.${dfrom || dto ? " The date filter applies to Open, Breached and Carats out; turnaround covers all closed orders." : ""}</p>
  <div class="panel"><table><thead><tr>
    <th>Factory</th><th class="num">Closed (n)</th><th class="num">Mean TAT</th><th class="num">Median TAT</th>
    <th class="num">Open</th><th class="num">Breached</th><th class="num">Carats out</th>
  </tr></thead><tbody>${data.factories.filter(inFactory).map(factoryStats).map((f) => {
    const bad = (x) => x != null && x > target ? ` style="color:var(--breach);font-weight:700"` : "";
    return `<tr><td><b>${esc(f.factory)}</b></td><td class="num">${f.tat.n}</td>
      <td class="num"${bad(f.tat.mean)}>${f.tat.mean ?? "—"}</td><td class="num"${bad(f.tat.median)}>${f.tat.median ?? "—"}</td>
      <td class="num">${f.open}</td><td class="num">${f.breached}</td><td class="num">${cts(f.carats)}</td></tr>`;
  }).join("")}</tbody></table></div>`;
}

function viewRisk() {
  const fs = data.factories.filter(inFactory).map(factoryStats);
  const max = Math.max(1, ...fs.map((f) => f.carats));
  const detail = factory && fs[0] ? `<div class="panel" style="margin-top:14px"><table class="stage-table"><thead><tr>
    <th>Stage</th><th class="num">Orders</th><th class="num">Carats</th></tr></thead><tbody>${STAGE_ORDER.map((st) =>
      `<tr><td>${chip(st)}</td><td class="num">${fs[0].byStage[st].count}</td><td class="num">${cts(fs[0].byStage[st].carats)}</td></tr>`).join("")}
    </tbody></table></div>` : "";
  return `<p class="small">Open carats by factory, split by stage.</p><div class="panel"><div class="bars">${fs.map((f) => `
    <div class="bar-row"><b>${esc(f.factory)}</b>
      <div class="bar" style="width:${Math.max(2, (f.carats / max) * 100)}%">${STAGE_ORDER.filter((s) => f.byStage[s].carats > 0).map((s) =>
        `<span title="${s}: ${cts(f.byStage[s].carats)} cts · ${f.byStage[s].count} orders" style="--c:${cv(s)};width:${(f.byStage[s].carats / f.carats) * 100}%"></span>`).join("")}</div>
      <span class="num">${cts(f.carats)} cts</span></div>`).join("")}
  </div><div class="legend">${STAGE_ORDER.map((s) => `<span><i style="--c:${cv(s)}"></i>${s}</span>`).join("")}</div></div>${detail}`;
}

function viewEx() {
  const e = data.exceptions;
  const box = (title, note, items) => `<div class="panel"><h3>${title} · ${items.filter(inFactory).length}</h3>
    <p class="small" style="padding:0 12px">${note}</p>${(items = items.filter(inFactory)).length ? `<table><thead><tr><th>Factory</th><th class="num">Row</th><th>Design</th><th>Detail</th></tr></thead><tbody>
    ${items.map((x) => `<tr><td>${esc(x.factory)}</td><td class="num">${x.row}</td><td>${esc(x.design)}</td><td>${esc(x.detail)}</td></tr>`).join("")}</tbody></table>` : `<div class="empty">None.</div>`}</div>`;
  return `<div class="exgrid">
    ${box("Likely received", "Received date is filled but no row carries a Received status. Excluded from the open list — fix the status in the sheet.", e.likelyReceived)}
    ${box("No issue date", "No usable date on the block, so no clock can run. Excluded from the open list.", e.noDate)}
    ${box("Odd status", data.config.knownStatuses.length ? "Status value outside the dropdown." : "Check disabled — set KNOWN_STATUSES to the dropdown values.", e.oddStatus)}
    ${e.beforeCutoff ? `<p class="small">${e.beforeCutoff} open orders issued before the cut-off are hidden.</p>` : ""}
  </div>`;
}

window.addEventListener("hashchange", () => {
  const p = new URLSearchParams(location.hash.slice(1));
  factory = p.get("f") || ""; dfrom = p.get("from") || ""; dto = p.get("to") || "";
  tier = { buyer: "Buyer", stock: "Stock" }[p.get("t")] || "";
  if (data) render();
});

load(false);
</script>
