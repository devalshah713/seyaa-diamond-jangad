# The UI. /api/board falls through to the Worker because no file matches it.
[assets]
directory = "../web"
binding = "ASSETS"

[[kv_namespaces]]
binding = "BOARD_CACHE"
id = "512b15e70a9d4e3495790c709abdc832"

[observability]
enabled = true

[vars]
SHEET_ID = "1IhNZlP3YxM8lVTboyxB2EeJkReGN86ONSHi-buNkE3I"
TABS = "Seyaa Solitaire,PRATIK C-6,RAKESH BABU,RAJKUMAR,Anthem Jewels"
STOCK_DUE = "8"
BUYER_DUE = "5"
